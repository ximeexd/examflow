<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ExamFlow — Квесты</title>
<link rel="icon" type="image/svg+xml" href="brand-avatar.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f3ea;--card:#fffdf7;--line:#e6e1d1;--ink:#12261c;--mute:#6b7a70;--dark:#0f2a1e;--dark2:#173b2a;--lime:#c6f94d;--limed:#9fcf2a;--gold:#e9a13b;--chip:#fbe9c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(#e2dccb 1px,transparent 1.2px) 0 0/16px 16px;color:var(--ink);font:500 15px/1.35 Onest,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:480px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.top h1{font-size:26px;font-weight:800;margin-right:auto}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .2s}.pill.pop{transform:scale(1.15)}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--dark2),var(--dark));color:#fff;border-radius:24px;padding:20px;box-shadow:0 5px 0 #06140d;margin-bottom:14px}
.tag{display:inline-block;background:#1f4a35;color:var(--lime);font-weight:800;font-size:11px;letter-spacing:.04em;padding:5px 10px;border-radius:99px}
.hero h2{font-size:26px;line-height:1.1;font-weight:800;margin:10px 0 4px;max-width:70%}.hero p{font-size:13px;color:#b9cfc0;margin-bottom:14px}
.seg{display:flex;gap:4px;margin-bottom:14px}.seg i{flex:1;height:6px;border-radius:4px;background:#3a5a49}.seg i.d{background:var(--lime)}
.coin{position:absolute;right:18px;top:18px;width:78px;height:78px}
.btn{display:block;width:100%;background:var(--lime);color:var(--dark);font-weight:800;font-size:16px;border:0;border-radius:15px;padding:14px;box-shadow:0 4px 0 var(--limed);text-decoration:none;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--limed)}
.btn:disabled{background:#2a4a3a;color:#8fb09c;box-shadow:none;cursor:default}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--limed)}.btn.sm:disabled{background:var(--line);color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;font-weight:700;font-size:13.5px;position:relative}
.tabs button.on{background:var(--dark);color:var(--lime);border-color:var(--dark);box-shadow:0 3px 0 #06140d}
.tabs em{position:absolute;top:-6px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--gold);color:#fff;font:800 11px/20px Onest,sans-serif;text-align:center;padding:0 5px;font-style:normal}
.q{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.q.rd{border-color:var(--limed);background:#f6ffd8;box-shadow:0 4px 0 var(--limed)}.q.cl{opacity:.65}
.qi{flex:none;width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center;box-shadow:0 3px 0 var(--limed)}.q.cl .qi{background:var(--line);box-shadow:0 3px 0 #d3cdbb}
.qi svg{width:32px;height:32px}.qb{flex:1;min-width:0}.qb>b{display:block;font-size:15.5px}.qb>small{display:block;color:var(--mute);font-size:12.5px;margin-bottom:8px}
.pr{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#8ccf2b,var(--lime));border-radius:8px;transition:width .4s}
.pr em{font-style:normal;font-size:12px;font-weight:800;white-space:nowrap}
.qf{display:flex;align-items:center;justify-content:space-between;gap:8px}.qf div{display:flex;gap:6px;flex-wrap:wrap}.rw{background:var(--chip);color:#8a5a00;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.note{font-size:13px;color:var(--mute);margin:0 2px 12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.bg .qi{margin:0 auto 8px;width:60px;height:60px;border-radius:50%}.bg b{display:block;font-size:14px}.bg small{font-size:12px;color:var(--mute)}.bg .bar{margin-top:8px}
.bg.lk .qi{background:var(--line);box-shadow:0 3px 0 #d3cdbb}.bg.lk svg{opacity:.45}.bg.ok{border-color:var(--limed);background:#f6ffd8}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--dark);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;border-radius:22px 22px 0 0}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:#a9c0b1;font-size:11.5px;font-weight:700;text-decoration:none}nav a span{font-size:19px;line-height:1}nav a.on{background:var(--lime);color:var(--dark)}
#ts{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-100px);z-index:12;background:var(--lime);color:var(--dark);font-weight:800;border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 var(--limed);transition:transform .3s;text-align:center;max-width:90%}#ts.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav><a href="index.html"><span>⌂</span>Главная</a><a href="tasks.html"><span>✎</span>Задания</a><a class="on" href="quests.html"><span>☆</span>Квесты</a><a href="profile.html"><span>☺</span>Профиль</a></nav>
<div id="ts" role="status"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="school_curriculum.js?v=3"></script>
<script src="state.js?v=5"></script>
<script src="sync.js?v=5"></script>
<script>
EFS.init().then(start).catch(EFS.showBootError);
function start(){
var K='stroke="#12261c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"';
var IC={book:'<path d="M24 12C18 8 10 8 4 10v28c6-2 14-2 20 2 6-4 14-4 20-2V10c-6-2-14-2-20 2Zm0 0v28"/>',
check:'<circle cx="24" cy="24" r="18"/><path d="M15 25l7 7 12-14"/>',
redo:'<path d="M36 18A14 14 0 1 0 38 28M38 8v10H28"/>',
star:'<path d="M24 6l5.5 12L42 19.5l-9 9 2.5 12.5L24 35l-11.500 6L15 28.500l-9-9L18.500 18Z"/>',
cal:'<rect x="6" y="10" width="36" height="32" rx="6"/><path d="M6 20h36M16 6v8M32 6v8M17 31l5 5 9-9"/>',
flame:'<path d="M24 6c2 8 12 12 12 24a12 12 0 0 1-24 0c0-6 4-8 5-14 3 2 4 5 4 8 3-4 4-10 3-18Z"/>',
target:'<circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="10"/><circle cx="24" cy="24" r="2" fill="#12261c"/>',
trophy:'<path d="M14 8h20v12a10 10 0 0 1-20 0ZM14 12H6c0 8 4 12 9 12M34 12h8c0 8-4 12-9 12M24 30v8M16 42h16"/>'};
function ic(k){return '<svg viewBox="0 0 48 48" '+K+' aria-hidden="true">'+IC[k]+'</svg>'}
var S=EF.get(),T=EF.today(),WK=EF.week();
var D=[{id:"d1",t:"Пройти занятие",d:"Закончи любое занятие",ic:"book",g:1,p:Math.min(T.lessons,1),xp:30,c:10,href:"tasks.html"},
{id:"d2",t:"5 верных ответов",d:"Считаются проверенные ответы",ic:"check",g:5,p:Math.min(T.correct,5),xp:20,c:5,href:"tasks.html"},
{id:"d3",t:"Повторить ошибки",d:"Разбери хотя бы одну ошибку",ic:"redo",g:1,p:Math.min(T.mistakes,1),xp:25,c:10,href:"lesson.html?mode=mistakes"},
{id:"d4",t:"Занятие без ошибок",d:"Ответь верно на все 5 вопросов",ic:"star",g:1,p:Math.min(T.clean,1),xp:50,c:20,href:"tasks.html"}];
var W=[{id:"w1",t:"Занимайся 5 дней",d:"В течение недели",ic:"cal",g:5,p:Math.min(EF.weekDaysCount(),5),xp:150,c:60},
{id:"w2",t:"50 верных ответов",d:"Набери за неделю",ic:"target",g:50,p:Math.min(WK.correct,50),xp:100,c:40},
{id:"w3",t:"Серия 7 дней",d:"Не пропускай ни дня",ic:"flame",g:7,p:Math.min(S.streak,7),xp:200,c:100}];
D.forEach(function(q){q.cl=T.claimedIds.includes(q.id)});
W.forEach(function(q){q.cl=WK.claimed.includes(q.id)});
var topicsDone=EF.subjects().reduce(function(a,n){return a+EF.passedCount(n)},0);
var A=[["Первый шаг","book",Math.min(EF.totalLessons(),1),1],["Серия 7 дней","flame",Math.min(S.streak,7),7],["100 ответов","check",Math.min(S.totalCorrect,100),100],["Первая тема","star",Math.min(topicsDone,1),1],["Без ошибок ×5","target",Math.min(S.cleanTotal,5),5],["Серия 30 дней","trophy",Math.min(S.streak,30),30]];
var st={tab:0,chest:T.chest},$=function(i){return document.getElementById(i)};
function rd(q){return q.p>=q.g&&!q.cl}
function badge(){return D.concat(W).filter(rd).length}
function card(q){var r=rd(q);return '<div class="q'+(r?" rd":"")+(q.cl?" cl":"")+'"><div class="qi">'+ic(q.ic)+'</div><div class="qb"><b>'+q.t+'</b><small>'+q.d+'</small><div class="pr"><div class="bar"><b style="width:'+Math.min(100,q.p/q.g*100)+'%"></b></div><em>'+Math.min(q.p,q.g)+' из '+q.g+'</em></div><div class="qf"><div><span class="rw">+'+q.xp+' XP</span><span class="rw">+'+q.c+' ◎</span></div>'+(q.cl?'<button class="btn sm" disabled>Получено</button>':r?'<button class="btn sm" data-c="'+q.id+'">Забрать</button>':'<a class="btn sm" href="'+(q.href||'tasks.html')+'" style="background:var(--dark);color:var(--lime);box-shadow:0 3px 0 #06140d">К занятию</a>')+'</div></div></div>'}
function left(){var n=new Date(),m=new Date(n);m.setHours(24,0,0,0);var s=Math.round((m-n)/60000);return Math.floor(s/60)+" ч "+s%60+" мин"}
function render(){var n=D.filter(function(q){return q.p>=q.g}).length,all=n==4,h='<div class="top"><h1>Квесты</h1><span class="pill" id="px">⚡ '+EF.get().xp+' XP</span><span class="pill" id="pc">◎ '+EF.get().coins+'</span></div>';
h+='<div class="tabs">'+["Сегодня","Неделя","Награды"].map(function(t,i){return '<button data-t="'+i+'" class="'+(st.tab==i?"on":"")+'">'+t+(i<2&&badge()&&((i==0&&D.some(rd))||(i==1&&W.some(rd)))?'<em>'+(i==0?D.filter(rd).length:W.filter(rd).length)+'</em>':"")+'</button>'}).join("")+'</div>';
if(st.tab==0){h+='<section class="hero"><svg class="coin" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="44" r="32" fill="#c27d1d"/><circle cx="40" cy="40" r="32" fill="#e9a13b"/><circle cx="40" cy="40" r="23" fill="none" stroke="#f6c76a" stroke-width="2" stroke-dasharray="4 4"/><text x="40" y="50" text-anchor="middle" font-size="30" fill="#0f2a1e">★</text></svg><span class="tag">КВЕСТЫ ДНЯ</span><h2>Выполнено '+n+' из 4</h2><p>Обновятся через '+left()+'</p><div class="seg">'+[0,1,2,3].map(function(i){return '<i class="'+(i<n?"d":"")+'"></i>'}).join("")+'</div><button class="btn" data-chest="1"'+(all&&!st.chest?"":" disabled")+'>'+(st.chest?"Сундук получен ✓":all?"Открыть сундук · +100 XP · +50 ◎":"Выполни все 4 — откроется сундук")+'</button></section>'+D.map(card).join("")}
else if(st.tab==1){h+='<p class="note">Недельные квесты обновятся в понедельник. Награды больше, а задания длиннее.</p>'+W.map(card).join("")}
else{h+='<p class="note">Достижения выдаются сами, когда выполнено условие.</p><div class="ach">'+A.map(function(a){var ok=a[2]>=a[3];return '<div class="bg '+(ok?"ok":"lk")+'"><div class="qi">'+ic(a[1])+'</div><b>'+a[0]+'</b><small>'+(ok?"Получено":a[2]+" из "+a[3])+'</small>'+(ok?"":'<div class="bar"><b style="width:'+a[2]/a[3]*100+'%"></b></div>')+'</div>'}).join("")+'</div>'}
$("app").innerHTML=h}
function toast(t){var e=$("ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function gain(xp,c){EF.addXP(xp);EF.addCoins(c);render();["px","pc"].forEach(function(i){var e=$(i);e.classList.add("pop");setTimeout(function(){e.classList.remove("pop")},250)});toast("+"+xp+" XP · +"+c+" ◎")}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.t){st.tab=+t.dataset.t;render();return}
if(t.dataset.c){var q=D.concat(W).filter(function(x){return x.id==t.dataset.c})[0];if(q&&rd(q)){var ok=q.id[0]=='d'?EF.claimDaily(q.id):EF.claimWeekly(q.id);if(ok){q.cl=1;EFS.claimQuest(q.id);gain(q.xp,q.c)}}return}
if(t.dataset.chest){if(D.every(function(q){return q.p>=q.g})&&!st.chest){st.chest=1;EF.today().chest=1;EF.save();gain(100,50)}return}});
render();
}
</script>
</body>
</html>
