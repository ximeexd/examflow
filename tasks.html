<style>
:root{--bg:#f4f0e6;--card:#fbf9f3;--line:#e6e0d0;--ink:#12291f;--mute:#9a9a8c;--acc:#c3f73a;--acc2:#a9e01f;--accsoft:#eaffb0;
box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent} *{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:Nunito,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100%;
background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:18px 18px}
.app{width:100%;max-width:480px;padding:20px 16px calc(100px + var(--ef-safe-bottom,env(safe-area-inset-bottom,0px)))}
.txt{color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.5px}
.xp{display:flex;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:900;font-size:14px;transition:transform .2s;white-space:nowrap}
.xp.pop{transform:scale(1.18)}
.xp svg{width:16px;height:16px}
.exam-sw{display:flex;gap:6px;margin-bottom:12px}
.exam-sw button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--mute);font:800 13px Nunito,sans-serif;padding:8px;border-radius:12px;cursor:pointer}
.exam-sw button.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;cursor:grab;touch-action:pan-x;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.tabs:active{cursor:grabbing}
.tab{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14px Nunito,sans-serif;padding:10px 16px;border-radius:99px;cursor:pointer;transition:.2s}
.tab.on{background:var(--acc);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.stat{display:flex;align-items:center;gap:14px;background:var(--accsoft);border:2px solid var(--acc2);border-radius:22px;padding:14px 16px;margin:8px 0 16px;color:var(--ink)}
.ring{width:54px;height:54px;flex:none}
.stat b{font-size:18px;font-weight:900;display:block}
.stat small{font-weight:700;opacity:.65;font-size:13px}
.card{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin-bottom:14px;color:var(--ink)}
.cur{background:var(--acc);border:2px solid var(--acc2);box-shadow:0 6px 0 var(--acc2);margin-bottom:22px;animation:rise .5s both}
.cur .wm,.lock .wm,.done .wm{position:absolute;right:12px;top:-6px;font-size:84px;font-weight:900;color:#fff;opacity:.35;line-height:1;pointer-events:none}
.lock{background:var(--card);border:2px solid var(--line);opacity:.8;padding:16px 18px}
.lock .wm{color:var(--line);opacity:.9}
.lock h3,.lock p{color:var(--mute)}
.done{background:var(--accsoft);border:2px solid var(--acc2)}
.badge{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:900;background:rgba(18,41,31,.12);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.lock .badge{background:var(--line);color:var(--mute)}
h3{margin:0 0 3px;font-size:21px;font-weight:900;max-width:62%;line-height:1.15}
.te{font-size:19px;margin-right:7px}
.lock h3{font-size:19px}
p{margin:0;font-size:13px;font-weight:700;opacity:.75}
.art{position:absolute;right:14px;top:46px;width:84px;height:70px;pointer-events:none}
.lock .art{opacity:.5;filter:grayscale(1)}
.fl{position:absolute;font-weight:900;color:var(--ink);opacity:.18;animation:fl 5s ease-in-out infinite;pointer-events:none}
.lock .fl{opacity:.1;animation:none}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0 16px}
.bar i{height:5px;border-radius:9px;background:rgba(18,41,31,.18)}
.bar i.f{background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.c{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:18px;text-decoration:none;color:inherit}
.c.d{background:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.c.d svg{width:20px;height:20px}
.c.n{background:#fff;border:3px solid var(--ink);animation:pulse 1.6s infinite;color:var(--ink)}
.c.e{background:rgba(18,41,31,.14);color:var(--ink);opacity:.6}
.btn{display:block;text-align:center;text-decoration:none;width:100%;border:0;border-radius:18px;background:var(--ink);color:var(--acc);font:900 16px Nunito,sans-serif;padding:16px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s,box-shadow .08s;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}

.hd{position:relative;min-height:100px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chev{position:absolute;right:0;top:0;width:30px;height:30px;border-radius:50%;background:rgba(18,41,31,.12);display:grid;place-items:center;font-size:15px;transition:transform .3s}
.lock .chev{background:var(--line);color:var(--mute)}
.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden;min-height:0}
.cur{margin-bottom:14px}
.c.l{background:var(--line)}
.btn.alt{background:rgba(18,41,31,.1);color:var(--ink);box-shadow:0 5px 0 rgba(18,41,31,.25)}
.btn.off{background:var(--line);color:var(--mute);box-shadow:0 5px 0 #d4cdb9;cursor:not-allowed;font-size:14px}
.card{transition:box-shadow .2s}

nav{position:fixed;left:var(--ef-safe-left,env(safe-area-inset-left,0px));right:var(--ef-safe-right,env(safe-area-inset-right,0px));bottom:0;background:#0f2a1e;display:flex;justify-content:space-around;padding:8px 10px calc(8px + var(--ef-safe-bottom,env(safe-area-inset-bottom,0px)));max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;z-index:10}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:#a9c0b1;font-size:11.5px;font-weight:800;text-decoration:none}
nav a span{font-size:19px;line-height:1}
nav a.on{background:var(--acc);color:var(--ink)}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,41,31,.45)}50%{box-shadow:0 0 0 8px rgba(18,41,31,0)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pc{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9}
</style>
