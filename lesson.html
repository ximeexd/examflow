<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamFlow — Занятие</title>
<link rel="icon" type="image/png" href="brand-avatar.png?v=1">
<link rel="preload" href="fonts/nunito-cyrillic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-cyrillic-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css?v=1">
<style>
:root{--bg:#f4f0e6;--card:#fbf9f3;--line:#e6e0d0;--ink:#12291f;--mute:#9a9a8c;--acc:#c3f73a;--acc2:#a9e01f;--accsoft:#eaffb0;--dark:#0f2a1e}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent} *{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(var(--line) 1.2px,transparent 1.2px) 0 0/18px 18px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh;min-height:var(--ef-tg-vh,100dvh)}
.app{width:100%;max-width:480px;padding:20px 16px calc(40px + var(--ef-safe-bottom,env(safe-area-inset-bottom,0px)));display:flex;flex-direction:column;min-height:100vh;min-height:var(--ef-tg-vh,100dvh)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px}
.prog{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ccf2b,var(--acc));border-radius:9px;transition:width .35s}
.xp{display:flex;gap:5px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 11px;font-weight:900;font-size:13px;transition:transform .2s}
.xp.pop{transform:scale(1.18)}
.xp svg{width:14px;height:14px}
.kick{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
h1{font-size:23px;font-weight:900;line-height:1.25;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px 18px;font:800 16px/1.3 Nunito,sans-serif;color:var(--ink);text-align:left;cursor:pointer;transition:.15s;box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:#cfc8b4}
.opt:disabled{cursor:default}
.opt.ok{background:var(--acc);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.opt.bad{background:#ffd6d6;border-color:#e88;box-shadow:0 3px 0 #d99}
.opt.dim{opacity:.55}
.exp{margin-top:16px;border-radius:18px;padding:16px;background:var(--card);border:2px solid var(--line);display:none}
.exp.show{display:block;animation:up .3s}
.exp.ok{border-color:var(--acc2);background:var(--accsoft)}
.exp.bad{border-color:#e88;background:#ffe9e9}
.exp b{display:block;font-size:15px;margin-bottom:4px}
.exp p{font-size:14px;font-weight:600;color:#41524a;margin:0}
.next{margin-top:auto;padding-top:18px}
.btn{display:block;text-align:center;text-decoration:none;width:100%;border:0;border-radius:18px;background:var(--ink);color:var(--acc);font:900 16px Nunito,sans-serif;padding:16px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);margin-top:10px}
.done-hero{background:linear-gradient(150deg,#173b2a,#0f2a1e);color:#fff;border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 6px 0 #06140d;margin-top:30px}
.done-hero .em{font-size:54px}
.done-hero h2{font-size:26px;font-weight:900;margin:8px 0 4px}
.done-hero p{color:#b9cfc0;font-weight:700;font-size:14px}
.rw{display:flex;justify-content:center;gap:10px;margin:18px 0}
.rw span{background:rgba(255,255,255,.12);border-radius:99px;padding:8px 16px;font-weight:900;font-size:15px}
.rw .g{color:#ffd93d}.rw .l{color:var(--acc)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.pc{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9}
</style>
<link rel="stylesheet" href="telegram-ui.css?v=8">
<link rel="stylesheet" href="math-text.css?v=1">
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" id="back" href="tasks.html">‹</a>
    <div class="prog"><i id="bar"></i></div>
    <div class="xp" id="xp"><svg viewBox="0 0 24 24" fill="#ff8a1f"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span id="xpv">0</span></div>
  </div>
  <div id="stage"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="telegram-ui.js?v=10"></script>
<script src="school_curriculum.js?v=3"></script>
<script src="state.js?v=11"></script>
<script src="sync.js?v=13"></script>
<script src="server-sync.js?v=4"></script>
<script src="math-text.js?v=1"></script>
<script src="lesson-view.js?v=14"></script>
</body>
</html>
