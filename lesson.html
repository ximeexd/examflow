<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamFlow — Занятие</title>
<link rel="icon" type="image/svg+xml" href="brand-avatar.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f4f0e6;--card:#fbf9f3;--line:#e6e0d0;--ink:#12291f;--mute:#9a9a8c;--acc:#c3f73a;--acc2:#a9e01f;--accsoft:#eaffb0;--dark:#0f2a1e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(var(--line) 1.2px,transparent 1.2px) 0 0/18px 18px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;padding:20px 16px 40px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px}
.prog{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ccf2b,var(--acc));border-radius:9px;transition:width .35s}
.xp{display:flex;gap:5px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 11px;font-weight:900;font-size:13px;transition:transform .2s}
.xp.pop{transform:scale(1.18)}
.xp svg{width:14px;height:14px}
.kick{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
h1{font-size:23px;font-weight:900;line-height:1.25;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px 18px;font:800 16px/1.3 Nunito,sans-serif;color:var(--ink);text-align:left;cursor:pointer;transition:.15s;box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:#cfc8b4}
.opt:disabled{cursor:default}
.opt.ok{background:var(--acc);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.opt.bad{background:#ffd6d6;border-color:#e88;box-shadow:0 3px 0 #d99}
.opt.dim{opacity:.55}
.exp{margin-top:16px;border-radius:18px;padding:16px;background:var(--card);border:2px solid var(--line);display:none}
.exp.show{display:block;animation:up .3s}
.exp.ok{border-color:var(--acc2);background:var(--accsoft)}
.exp.bad{border-color:#e88;background:#ffe9e9}
.exp b{display:block;font-size:15px;margin-bottom:4px}
.exp p{font-size:14px;font-weight:600;color:#41524a;margin:0}
.next{margin-top:auto;padding-top:18px}
.btn{display:block;text-align:center;text-decoration:none;width:100%;border:0;border-radius:18px;background:var(--ink);color:var(--acc);font:900 16px Nunito,sans-serif;padding:16px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);margin-top:10px}
.done-hero{background:linear-gradient(150deg,#173b2a,#0f2a1e);color:#fff;border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 6px 0 #06140d;margin-top:30px}
.done-hero .em{font-size:54px}
.done-hero h2{font-size:26px;font-weight:900;margin:8px 0 4px}
.done-hero p{color:#b9cfc0;font-weight:700;font-size:14px}
.rw{display:flex;justify-content:center;gap:10px;margin:18px 0}
.rw span{background:rgba(255,255,255,.12);border-radius:99px;padding:8px 16px;font-weight:900;font-size:15px}
.rw .g{color:#ffd93d}.rw .l{color:var(--acc)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.pc{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" id="back" href="tasks.html">‹</a>
    <div class="prog"><i id="bar"></i></div>
    <div class="xp" id="xp"><svg viewBox="0 0 24 24" fill="#ff8a1f"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span id="xpv">0</span></div>
  </div>
  <div id="stage"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="school_curriculum.js?v=3"></script>
<script src="fipi_curriculum_topics.js?v=3"></script>
<script src="fipi_question_bank.js?v=3"></script>
<script src="sqb_math_oge.js?v=3"></script>
<script src="sqb_math_ege_base.js?v=3"></script>
<script src="sqb_math_ege_prof.js?v=3"></script>
<script src="sqb_informatics_oge.js?v=3"></script>
<script src="sqb_physics_oge.js?v=3"></script>
<script src="sqb_physics_ege.js?v=3"></script>
<script src="sqb_informatics_ege.js?v=3"></script>
<script src="sqb_biology_oge.js?v=3"></script>
<script src="sqb_biology_ege.js?v=3"></script>
<script src="sqb_geography_oge.js?v=3"></script>
<script src="sqb_geography_ege.js?v=3"></script>
<script src="sqb_literature_oge.js?v=3"></script>
<script src="sqb_literature_ege.js?v=3"></script>
<script src="sqb_russian_oge.js?v=3"></script>
<script src="sqb_russian_ege.js?v=3"></script>
<script src="sqb_social_oge.js?v=3"></script>
<script src="sqb_social_ege.js?v=3"></script>
<script src="sqb_chemistry_oge.js?v=3"></script>
<script src="sqb_chemistry_ege.js?v=3"></script>
<script src="sqb_history_oge.js?v=3"></script>
<script src="sqb_history_ege.js?v=3"></script>
<script src="sqb_english_oge.js?v=3"></script>
<script src="sqb_english_ege.js?v=3"></script>
<script src="school_question_bank.js?v=3"></script>
<script src="state.js?v=6"></script>
<script src="sync.js?v=6"></script>
<script>
EFS.init().then(startLessonPage).catch(EFS.showBootError);
function startLessonPage(){
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const subj=P.get('s')||EF.get().active, tk=P.get('t'), mode=P.get('mode')||'', li=+(P.get('l')||1);
const exam=EF.get().exam;
const S=EF.get(),T=EF.today();
let qs=[];
if(mode==='mistakes'){qs=S.mistakes.slice(0,5)}
else if(mode==='mix'){const all=(window.getSchoolTopicQuestions&&getSchoolTopicQuestions(exam,subj,tk))||[];const rec=EF.topics(subj).find(x=>x.key===tk);const all2=all.length?all:(rec?getSchoolTopicQuestions(exam,subj,rec.title)||[]:[]);qs=[...all2].sort(()=>Math.random()-.5).slice(0,5)}
else{qs=(window.getSchoolLessonQuestions&&getSchoolLessonQuestions(exam,subj,tk,li))||[]}

const topicTitle=(EF.topics(subj).find(x=>x.key===tk)||{title:tk}).title;
$('back').href='tasks.html?s='+encodeURIComponent(subj);
$('xpv').textContent=S.xp;
function syncXP(){$('xpv').textContent=EF.get().xp}
const stage=$('stage');

if(!qs.length){
 stage.innerHTML=`<div class="done-hero"><div class="em">📭</div><h2>Занятие не найдено</h2><p>Для этой темы пока нет заданий в банке.</p></div><div class="next"><a class="btn" href="tasks.html">К заданиям</a></div>`;
}else{
 EF.startLesson(); syncXP();
 let i=0,right=0,answered=false;
 const boom=el=>{const r=(el||document.body).getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cols=['#c3f73a','#ff8a1f','#ff7eb6','#5cbff2','#12291f','#ffd93d'];
  for(let k=0;k<26;k++){const p=document.createElement('i');p.className='pc';p.style.cssText=`left:${x}px;top:${y}px;background:${cols[k%6]}`;document.body.appendChild(p);
   const a=Math.random()*6.28,d=60+Math.random()*110;
   p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}};
 function q(){
  const item=qs[i];answered=false;
  $('bar').style.width=(i/qs.length*100)+'%';
  const ord=item.opts.map((o,ix)=>({o,ix})).sort(()=>Math.random()-.5);
  stage.innerHTML=`<div class="kick">${mode==='mistakes'?'Работа над ошибками':mode==='mix'?'Повторение темы':'Занятие '+li+' · '+topicTitle}</div>
   <h1>${item.q}</h1>
   <div class="opts">${ord.map(({o,ix})=>`<button class="opt" data-a="${ix===item.ans}">${o}</button>`).join('')}</div>
   <div class="exp" id="exp"></div>
   <div class="next"><button class="btn" id="next" style="display:none">Дальше</button></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(answered)return;answered=true;
   const ok=b.dataset.a==='true',ex=$('exp');
   stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true;
    if(x.dataset.a==='true')x.classList.add('ok');else if(x===b)x.classList.add('bad');else x.classList.add('dim')});
   if(ok){right++;EF.addXP(2);const bonus=EF.recordCorrect();if(mode==='mistakes'){EF.dropMistake(item.id);EF.recordMistakeFixed()}
    ex.className='exp show ok';ex.innerHTML=`<b>Верно! +2 XP${bonus?' (+'+bonus+' за 5 правильных)':''}</b><p>${item.exp}</p>`;
    syncXP();$('xp').classList.add('pop');setTimeout(()=>$('xp').classList.remove('pop'),250);}
   else{EF.addMistake(item);
    ex.className='exp show bad';ex.innerHTML=`<b>Неверно. Правильный ответ выделен зелёным</b><p>${item.exp}</p>`;}
   const nx=$('next');nx.style.display='block';nx.textContent=i+1<qs.length?'Дальше':'Завершить';
  });
  $('next').onclick=()=>{i++;i<qs.length?q():finish()};
 }
 function finish(){
  $('bar').style.width='100%';
  if(mode!=='mistakes')EFS.lesson(subj,tk,right); // сервер считает XP/монеты сам
  let xpg=0,cg=0,extra='';
  if(mode==='mix'||mode==='mistakes'){EF.addXP(5);xpg+=5}
  else{const r=EF.finishLesson(subj,tk);if(r.isNew){EF.addXP(20);EF.addCoins(10);xpg+=20;cg+=10;if(r.doneNow){EF.addXP(30);EF.addCoins(15);xpg+=30;cg+=15;extra='Тема пройдена! 🎉'}}else{EF.addXP(5);xpg+=5}}
  if(right===qs.length)EF.recordClean();
  syncXP();
  const em=right===qs.length?'🏆':right>=3?'💪':'📚';
  stage.innerHTML=`<div class="done-hero"><div class="em">${em}</div><h2>${right} из ${qs.length} верно</h2><p>${extra||topicTitle}</p>
   <div class="rw"><span class="l">+${xpg+right*2} XP</span>${cg?`<span class="g">+${cg} ◎</span>`:''}</div></div>
   <div class="next"><a class="btn" href="${mode?'tasks.html?s='+encodeURIComponent(subj):'lesson.html?s='+encodeURIComponent(subj)+'&t='+encodeURIComponent(tk)+'&l='+Math.min(10,li+1)}">${mode||li>=10?'К заданиям':'Следующее занятие →'}</a>
   <a class="btn ghost" href="tasks.html?s=${encodeURIComponent(subj)}">К списку тем</a></div>`;
  boom(stage.querySelector('.done-hero'));
 }
 q();
}
}
</script>
</body>
</html>
