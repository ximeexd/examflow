<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamFlow — Главная</title>
<link rel="icon" type="image/svg+xml" href="brand-avatar.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f3ea;--card:#fffdf7;--line:#e6e1d1;--ink:#12261c;--mute:#6b7a70;--dark:#0f2a1e;--dark2:#173b2a;--lime:#c6f94d;--lime-d:#9fcf2a;--gold:#e9a13b;--chip:#fbe9c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(#e2dccb 1px,transparent 1.2px) 0 0/16px 16px;color:var(--ink);font:500 15px/1.35 Onest,system-ui,sans-serif;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin-right:auto}
.logo img{width:30px;height:30px;border-radius:9px;display:block}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.hero{background:linear-gradient(150deg,var(--dark2),var(--dark));color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:0 5px 0 #06140d}
.hero small{color:#b9cfc0;font-size:13px}
.tag{display:inline-block;margin:8px 0 6px;background:#1f4a35;color:var(--lime);font-weight:800;font-size:11px;letter-spacing:.04em;padding:5px 10px;border-radius:99px}
.hero h1{font-size:28px;line-height:1.1;font-weight:800;max-width:11ch;margin-bottom:12px}
.seg{display:flex;gap:4px;margin-bottom:10px;max-width:200px}
.seg b{flex:1;height:4px;border-radius:4px;background:#3a5a49}
.seg b.d{background:var(--lime)}.seg b.c{background:var(--gold)}
.meta{display:flex;gap:12px;font-size:12.5px;color:#b9cfc0;margin-bottom:16px}.meta b{color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 13px Onest,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--lime);border-color:var(--dark)}
.art{position:absolute;right:-6px;top:46px;width:150px;height:131px}
.art svg{width:100%;height:100%;overflow:visible}
.art.sw svg{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-4deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.art.sw svg{animation:none}}
.hero h1{font-size:26px;max-width:60%}.seg{max-width:150px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--lime);color:var(--dark);font:800 16px Onest,sans-serif;border:0;border-radius:16px;padding:15px;box-shadow:0 4px 0 var(--lime-d);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lime-d)}
.streak{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.srow{display:flex;align-items:center;gap:12px}
.flame{font-size:34px}
.srow strong{font-size:28px;font-weight:800;line-height:1}
.srow span{display:block;font-size:13px;color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--mute);margin:14px 0}
.days i{display:grid;place-items:center;width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--line);color:var(--mute);font-style:normal;font-weight:800;font-size:14px}
.days i.on{background:var(--lime);color:var(--dark)}
.lvl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:6px}
.lvl em{font-style:normal;font-size:20px;font-weight:800}.lvl small{color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ccf2b,var(--lime));border-radius:8px;transition:width .5s}
.reward{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-top:10px;font-weight:700;text-decoration:none;color:inherit}
.reward>em{font-style:normal;background:var(--chip);color:#8a5a00;font-size:12px;padding:3px 10px;border-radius:99px}
h2{font-size:19px;font-weight:800;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:12px;font-weight:500;color:var(--mute)}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;text-decoration:none;color:inherit}
.n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.n.done{background:var(--lime);border-color:var(--lime-d)}
.task div{flex:1;min-width:0}.task b{display:block;font-size:15px}.task p{font-size:12.5px;color:var(--mute)}
.task em{font-style:normal;font-size:12.5px;font-weight:800;white-space:nowrap}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;display:block}
.tool i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--dark);color:var(--lime);font-style:normal;font-size:18px;margin-bottom:10px}
.tool b{display:block;font-size:14px}.tool p{font-size:12px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--dark);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;border-radius:22px 22px 0 0}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:#a9c0b1;font-size:11.5px;font-weight:700;text-decoration:none}
nav a span{font-size:19px;line-height:1}
nav a.on{background:var(--lime);color:var(--dark)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* onboarding */
#ob{display:none;position:fixed;inset:0;z-index:20;justify-content:center;background:var(--bg);background-image:radial-gradient(#e2dccb 1.2px,transparent 1.2px);background-size:18px 18px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#ob:before,#ob:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
#ob:before{width:340px;height:340px;top:-120px;right:-110px;background:var(--lime);opacity:.35}
#ob:after{width:380px;height:380px;bottom:-150px;left:-130px;background:#eaffb0}
.obw{position:relative;z-index:1;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:14px 18px 18px;margin:0 auto;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
.obt{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.obt button{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--line);font:800 16px Onest,sans-serif;cursor:pointer;color:#12291f}
.obt span{flex:none;width:36px}
.obp{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.obp i{height:9px;border-radius:9px;background:var(--line);transition:.3s}
.obp i.f{background:var(--lime-d)}
.obhero{display:flex;align-items:flex-end;gap:12px;margin:8px 0 14px}
.mas{width:100px;flex:none;animation:bob 2.4s ease-in-out infinite}
.bub{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:13px 15px;font-weight:800;font-size:18px;line-height:1.25;color:#12291f;margin-bottom:30px}
.bub:before{content:'';position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.obm{flex:1;overflow-y:auto;padding:4px 2px 12px}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;font:inherit;color:#12291f;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:.15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .oe{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--bg);border-radius:14px;flex:none}
.opt b{display:block;font-size:17px;font-weight:800}.opt small{font-weight:700;opacity:.6;font-size:13px;display:block}
.opt.on{background:var(--lime);border-color:var(--lime-d);box-shadow:0 4px 0 var(--lime-d)}
.opt.on .oe{background:rgba(255,255,255,.55)}
.opt.on:after{content:'✓';position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#12291f;color:var(--lime);display:grid;place-items:center;font-size:14px;font-weight:800}
.two .opt{flex-direction:column;text-align:center;gap:6px;padding:12px 6px}.two .opt b{font-size:14px}
.two .opt.on:after{right:7px;top:7px;transform:none;width:22px;height:22px;font-size:12px}
.opts.in .opt{animation:rise .4s both}
.sum{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sum span{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:9px 15px;font-weight:800;font-size:14px;color:#12291f}
.wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:0}
.stage{position:relative;width:270px;height:230px;display:grid;place-items:center;flex:none}
.stage:before{content:'';position:absolute;width:210px;height:210px;border-radius:50%;background:var(--card);border:2px dashed var(--line)}
.stage .mas{width:160px;position:relative}
.orb{position:absolute;width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:25px;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.wel h2{font-size:29px;font-weight:800;line-height:1.2;margin:0;color:#12291f}
.hl{background:var(--lime);padding:0 8px;border-radius:10px}
.wel p{margin:0;font-size:14px;font-weight:700;color:#12291f;opacity:.7;max-width:300px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:4px}
.feats div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 4px;font-weight:800;font-size:12px;color:#12291f;line-height:1.2}
.feats i{display:block;font-style:normal;font-size:26px;margin-bottom:3px}
.obbtn{display:block;width:100%;background:var(--lime);color:var(--dark);font:800 16px Onest,sans-serif;border:0;border-radius:15px;padding:14px;box-shadow:0 4px 0 var(--lime-d);cursor:pointer}
.obbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lime-d)}
.obbtn:disabled{background:var(--line);color:var(--mute);box-shadow:0 4px 0 #d3cdbb;cursor:not-allowed}
.pc{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:30}
/* auth */
#auth{display:none;position:fixed;inset:0;z-index:25;justify-content:center;align-items:center;background:var(--bg);background-image:radial-gradient(#e2dccb 1.2px,transparent 1.2px);background-size:18px 18px;padding:18px}
.acard{width:100%;max-width:380px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 6px 0 var(--line);text-align:center}
.acard .mascot{width:96px;margin:0 auto 8px;display:block}
.acard h2{font-size:23px;font-weight:800;margin:0 0 4px}
.acard p{font-size:13.5px;color:var(--mute);font-weight:700;margin:0 0 16px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font:700 15px Onest,sans-serif;margin-bottom:10px}
.inp:focus{outline:3px solid var(--lime);border-color:var(--lime-d)}
.aerr{color:#c0392b;font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px}
.alink{background:none;border:0;color:var(--mute);font:700 13px Onest,sans-serif;text-decoration:underline;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="brand-avatar.svg" alt="" width="30" height="30">ExamFlow</div>
  <div class="pill" id="pill-xp">⚡ 0 XP</div>
  <div class="pill" id="pill-coins">◎ 0</div>
</header>

<div class="chips" id="chips" role="group" aria-label="Предмет"></div>

<section class="hero">
  <small id="hello">набираем темп.</small><br>
  <span class="tag" id="tag"></span>
  <h1 id="ttl"></h1>
  <div class="seg" id="seg"></div>
  <div class="meta" id="meta"></div>
  <div class="art" id="art" aria-hidden="true"></div>
  <a class="btn" id="cta" href="tasks.html">Начать →</a>
</section>

<section class="streak">
  <div class="srow"><div class="flame">🔥</div><div><strong id="streak-n">0</strong><span>дней подряд</span></div></div>
  <div class="days" id="days"></div>
  <div class="lvl"><span id="lvl-n">Уровень 1</span><span><em id="lvl-xp">0 XP</em> <small>из 500</small></span></div>
  <div class="bar"><b id="lvl-bar"></b></div>
</section>

<a class="reward" href="quests.html"><span>Награды дня</span><em id="rw-state">0 из 3</em></a>

<h2>План на сегодня <small>три шага</small></h2>
<div id="plan"></div>

<h2>Твои инструменты</h2>
<div class="tools">
  <a class="tool" href="lesson.html?mode=mistakes"><i>⟳</i><b>Повторить ошибки</b><p id="mist-cnt">пока пусто</p></a>
  <a class="tool" href="tasks.html"><i>⚑</i><b>Учебный маршрут</b><p>10 занятий темы</p></a>
</div>

<nav>
  <a class="on" href="index.html"><span>⌂</span>Главная</a>
  <a href="tasks.html"><span>✎</span>Задания</a>
  <a href="quests.html"><span>☆</span>Квесты</a>
  <a href="profile.html"><span>☺</span>Профиль</a>
</nav>
<div id="ob"></div>
<div id="auth"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="school_curriculum.js?v=3"></script>
<script src="state.js?v=5"></script>
<script src="sync.js?v=5"></script>
<script>
EFS.init().then(start).catch(EFS.showBootError);
function start(){
const $=id=>document.getElementById(id);
const S=EF.get(),T=EF.today();

/* === onboarding (первый вход) === */
const MASCOT='<img class="mas" src="brand-avatar.svg" alt="ExamFlow">';
const EXAMS=[['oge','ОГЭ','9 класс · основной экзамен','🎒'],['ege','ЕГЭ','11 класс · выпускной экзамен','🎓'],['oge','Пока не знаю','Просто хочу подтянуть школьные темы','🧭']];
const OBSUBJ=[['Математика','🧮'],['Русский язык','✍️'],['Информатика','💻'],['Обществознание','⚖️'],['Физика','⚡'],['Биология','🧬'],['Химия','⚗️'],['История','🏛️'],['Английский','🇬🇧'],['Литература','📖'],['География','🌍']];
const GOALS=[[5,'5 минут','Спокойный темп','🌱'],[10,'10 минут','Обычный','🚶'],[20,'20 минут','Серьёзный','🏃'],[30,'30+ минут','Интенсив','🚀']];
const obSubjList=()=>ob.exam=='ege'?OBSUBJ.flatMap(s=>s[0]=='Математика'?[['Базовая математика','🧮'],['Профильная математика','📐']]:[s]):OBSUBJ;
const oopt=(k,v,e,t,s2,on)=>`<button class="opt ${on?'on':''}" data-o="${k}" data-v="${v}"><span class="oe">${e}</span><span><b>${t}</b>${s2?`<small>${s2}</small>`:''}</span></button>`;
const WEL=()=>`<div class="wel"><div class="stage">${[['🧮',2,6],['📖',76,2],['🧬',0,54],['⚗️',82,52],['🌍',12,84],['💻',72,86]].map(([e,x,y],i)=>`<span class="orb" style="left:${x}%;top:${y}%;animation-delay:${i*.5}s">${e}</span>`).join('')}${MASCOT}</div><h2>Готовься к <span class="hl">ОГЭ</span> и <span class="hl">ЕГЭ</span> как в игре</h2><p>Короткие занятия, XP и серии — учёба станет привычкой</p><div class="feats"><div><i>🔥</i>Серии дней</div><div><i>⚡</i>XP и награды</div><div><i>🎯</i>Задания по темам</div></div></div>`;
let ob={};
function obr(){
 const o=$('ob'),s=ob.step,ch=ob.last!==s;ob.last=s;
 const say=['Привет! Я помогу подготовиться к экзаменам','К какому экзамену готовимся?','Какие предметы будем учить?','Сколько времени в день уделишь?','Отлично! Всё готово'][s];
 let body='',ok=true,cta='Продолжить';
 if(s==0)cta='Начать';
 if(s==1){body=`<div class="opts">${EXAMS.map(([k,n,d,e])=>oopt('exam',k,e,n,d,ob.exam==k)).join('')}</div>`;ok=!!ob.exam}
 if(s==2){body=`<div class="opts two">${obSubjList().map(([n,e])=>oopt('sub',n,e,n,'',ob.subs.includes(n))).join('')}</div>`;ok=ob.subs.length>0;if(ok)cta='Продолжить · '+ob.subs.length}
 if(s==3){body=`<div class="opts">${GOALS.map(([v,n,d,e])=>oopt('goal',v,e,n,d,ob.goal==v)).join('')}</div>`;ok=!!ob.goal}
 if(s==4){body=`<div class="sum"><span>🎯 ${ob.exam=='ege'?'ЕГЭ':'ОГЭ'}</span><span>📚 Предметов: ${ob.subs.length}</span><span>⏱ ${ob.goal} мин в день</span></div>`;cta='Перейти к заданиям'}
 o.innerHTML=`<div class="obw"><div class="obt">${s>0?'<button id="obb">←</button>':'<span></span>'}<div class="obp">${[1,2,3,4].map(k=>`<i class="${s>=k?'f':''}"></i>`).join('')}</div><span></span></div>${s==0?WEL():`<div class="obhero">${MASCOT}<div class="bub">${say}</div></div><div class="obm">${body}</div>`}<button class="obbtn" id="obn" ${ok?'':'disabled'}>${cta}</button></div>`;
 if(ch)o.querySelectorAll('.opts').forEach(x=>{x.classList.add('in');x.querySelectorAll('.opt').forEach((b,i)=>b.style.animationDelay=i*45+'ms')});
 if(s==4&&ob.fresh){ob.fresh=0;setTimeout(()=>boom(o.querySelector('.mas')),200)}
}
function boom(el){
 if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cols=['#c6f94d','#ff8a1f','#ff7eb6','#5cbff2','#12291f','#ffd93d'];
 for(let i=0;i<26;i++){const p=document.createElement('i');p.className='pc';p.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%6]}`;document.body.appendChild(p);
  const a=Math.random()*6.28,d=60+Math.random()*110;
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}
}
$('ob').addEventListener('click',e=>{
 const b=e.target.closest('[data-o]');
 if(b){const k=b.dataset.o,v=b.dataset.v;
  if(k=='exam'){ob.exam=v;const ok=obSubjList().map(x=>x[0]);ob.subs=ob.subs.filter(x=>ok.includes(x))}
  else if(k=='sub'){const i=ob.subs.indexOf(v);i<0?ob.subs.push(v):ob.subs.splice(i,1)}
  else ob.goal=+v;
  obr();return}
 if(e.target.closest('#obn')){if(ob.step<4){ob.step++;obr()}else{
  S.exam=ob.exam;S.subs=ob.subs;S.goal=ob.goal;S.onboarded=1;
  if(!EF.subjects().includes(S.active))S.active=EF.subjects()[0];
  EF.save();location.reload()}return}
 if(e.target.closest('#obb')){ob.step--;obr();return}
});
/* === auth: вход/регистрация перед входом в приложение === */
let amode='in';
function arender(){
 const a=$('auth');
 a.innerHTML=`<div class="acard">${MASCOT.replace('class="mas"','class="mascot"')}
  <h2>${amode=='in'?'С возвращением!':'Создаём аккаунт'}</h2>
  <p>${amode=='in'?'Войди, чтобы продолжить серию':'Прогресс сохранится на всех устройствах'}</p>
  <input class="inp" id="aem" type="email" placeholder="Почта" autocomplete="email">
  <input class="inp" id="apw" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="${amode=='in'?'current-password':'new-password'}">
  <div class="aerr" id="aerr"></div>
  <button class="obbtn" id="ago">${amode=='in'?'Войти':'Зарегистрироваться'}</button>
  <button class="alink" id="asw">${amode=='in'?'Нет аккаунта? Регистрация':'Уже есть аккаунт? Войти'}</button>
  <button class="alink" id="askip" style="display:block;margin:8px auto 0">Продолжить без аккаунта</button></div>`;
 a.style.display='flex';
 $('asw').onclick=()=>{amode=amode=='in'?'up':'in';arender()};
 $('askip').onclick=()=>{a.style.display='none';localStorage.setItem('ef_guest','1');maybeOb()};
 $('ago').onclick=async()=>{
  const em=$('aem').value.trim(),pw=$('apw').value,er=$('aerr');
  er.textContent='';
  if(!em||pw.length<6){er.textContent='Введи почту и пароль (мин. 6 символов)';return}
  $('ago').disabled=true;
  try{
   let r;
   EFS.authenticating=true;
   try{r=amode=='in'?await EFS.signIn(em,pw):await EFS.signUp(em,pw)}
   finally{EFS.authenticating=false}
   if(r.error)throw r.error;
   if(amode=='up'&&!r.data.session){er.textContent='Проверь почту — пришло письмо для подтверждения';$('ago').disabled=false;return}
   EFS.user=r.data.user;
   await EFS.pull(); await EFS.pushProgress();
   a.style.display='none';localStorage.removeItem('ef_guest');location.reload();
  }catch(e){er.textContent=e.message||'Ошибка входа';$('ago').disabled=false}
 };
}
function maybeOb(){if(!EF.get().onboarded){ob={step:0,fresh:1,exam:null,subs:[],goal:null};$('ob').style.display='flex';obr()}}
if(EFS.user||localStorage.getItem('ef_guest'))maybeOb();else arender();

const ARTS={
 'Математика':{b:"X²",f:"ax²+bx+c",s:"D = b² − 4ac",c:"#c6f94d",d:"#8fbd1f"},
 'Базовая математика':{b:"X²",f:"ax²+bx+c",s:"D = b² − 4ac",c:"#c6f94d",d:"#8fbd1f"},
 'Профильная математика':{b:"∫",f:"f'(x)",s:"lim x→0",c:"#c6f94d",d:"#8fbd1f"},
 'Русский язык':{b:"Аа",f:"не + гл.",s:"раздельно",c:"#ffc29a",d:"#d98a57"},
 'Физика':{b:"F",f:"F = m·a",s:"p = m·v",c:"#9fe0ff",d:"#53aed6"},
 'Информатика':{b:"01",f:"1011₂ = 11",s:"log₂8 = 3",c:"#c9b8ff",d:"#8f7bd6"},
 'Химия':{b:"H₂O",f:"2H₂ + O₂",s:"→ 2H₂O",c:"#ffadca",d:"#d96b94"},
 'Биология':{b:"ДНК",f:"А–Т · Г–Ц",s:"ген→белок",c:"#8ff0b4",d:"#4cbf7d"},
 'Обществознание':{b:"§",f:"спрос ↔ цена",s:"ст. 15 Конст.",c:"#9fdcff",d:"#5cbff2"},
 'История':{b:"1812",f:"Бородино",s:"Крымская война",c:"#f4d9a6",d:"#d9a85e"},
 'Английский':{b:"Aa",f:"to be + Ving",s:"Present Perfect",c:"#b8e6ff",d:"#6dbfe8"},
 'Литература':{b:"§",f:"Пушкин",s:"Горе от ума",c:"#ffc9a6",d:"#e08e5a"},
 'География':{b:"N°",f:"55,7° ш.",s:"Урал · Сибирь",c:"#a9e8d8",d:"#55bd9d"}
};
const aof=n=>ARTS[n]||{b:"★",f:"ExamFlow",s:"к цели",c:"#c6f94d",d:"#8fbd1f"};
function art(o){return '<svg viewBox="0 0 160 140"><g transform="rotate(-7 53 62)"><rect x="14" y="14" width="76" height="98" rx="9" fill="#f4f1e8"/><text x="24" y="40" font-size="15" font-weight="800" fill="#12261c" font-family="Onest,sans-serif">'+o.b+'</text><path d="M27 68h50M27 80h50M27 92h50" stroke="#d3cdbb" stroke-width="2" stroke-linecap="round"/><path d="M27 104h32" stroke="#e9a13b" stroke-width="3.5" stroke-linecap="round"/></g><g transform="rotate(8 100 85)"><rect x="56" y="50" width="82" height="82" rx="11" fill="'+o.d+'"/><rect x="56" y="44" width="82" height="82" rx="11" fill="'+o.c+'"/><text x="66" y="72" font-size="12.5" font-weight="800" fill="#0f2a1e" font-family="Onest,sans-serif">'+o.f+'</text><text x="66" y="91" font-size="10" fill="#0f2a1e" font-family="Onest,sans-serif">'+o.s+'</text><path d="M66 104h40M66 113h26" stroke="#0f2a1e" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="130" cy="26" r="16" fill="#c27d1d"/><circle cx="130" cy="23" r="16" fill="#e9a13b"/><circle cx="130" cy="23" r="11.5" fill="none" stroke="#f6c76a" stroke-dasharray="2 2"/><text x="130" y="29" text-anchor="middle" font-size="16" fill="#0f2a1e">★</text><rect x="4" y="98" width="16" height="16" rx="4" fill="#c6f94d" transform="rotate(45 12 106)"/><text x="104" y="138" font-size="14" font-weight="800" fill="#c6f94d">+</text><text x="150" y="70" font-size="14" font-weight="800" fill="#c6f94d">=</text></svg>'}

$('pill-xp').textContent='⚡ '+S.xp+' XP';
$('pill-coins').textContent='◎ '+S.coins;
$('hello').textContent=S.name+', набираем темп.';

function show(subj){
 S.active=subj;EF.save();
 const n=EF.next(subj);
 const o=Object.assign({},aof(subj));
 document.getElementById('tag').textContent=EF.examName()+' · '+subj.toUpperCase();
 document.getElementById('ttl').textContent=n?n.topic.title:'Курс пройден!';
 const seg=document.getElementById('seg');
 const d=n?EF.lessonsDone(subj,n.topic.key):10;
 seg.innerHTML=Array.from({length:10},(_,k)=>`<b class="${k<d?'d':k===d?'c':''}"></b>`).join('');
 document.getElementById('meta').innerHTML=n?`<span>Занятие <b>${n.lesson} из 10</b></span><span><b>5</b> вопросов</span><span>≈ <b>5 мин</b></span>`:'<span><b>Все темы пройдены</b> — можно повторять</span>';
 const cta=document.getElementById('cta');
 cta.textContent=n?(d?'Продолжить · занятие '+n.lesson+' →':'Начать · занятие 1 →'):'Повторить курс →';
 cta.href=n?`lesson.html?s=${encodeURIComponent(subj)}&t=${encodeURIComponent(n.topic.key)}&l=${n.lesson}`:`tasks.html?s=${encodeURIComponent(subj)}`;
 const a=document.getElementById('art');a.innerHTML=art(o);a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw');
 document.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',b.textContent===subj)});
}
const ch=document.getElementById('chips');
EF.subjects().forEach(function(n){var b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=function(){show(n)};ch.appendChild(b)});
show(S.active);

const pl=(n,f)=>n+' '+f[(n%10===1&&n%100!==11)?0:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2)];
$('streak-n').textContent=S.streak;
$('streak-n').nextElementSibling.textContent=pl(S.streak,['день','дня','дней']).replace(/^\d+ /,'')+' подряд';
$('days').innerHTML=EF.weekDays().map(d=>`<div>${d.label}<i class="${d.on?'on':''}">${d.on?'✓':'·'}</i></div>`).join('');
$('lvl-n').textContent='Уровень '+EF.level();
$('lvl-xp').textContent=S.xp+' XP';
$('lvl-bar').style.width=EF.levelPct()+'%';
const need=EF.level()*500-S.xp;
$('lvl-bar').parentElement.previousElementSibling.querySelector('small').textContent='до ур. '+(EF.level()+1)+' ещё '+need;

const goals=[T.lessons>=1,T.correct>=5,T.claimed||S.coins>0&&T.lessons>=1];
const doneCnt=goals.filter(Boolean).length;
$('rw-state').textContent=(T.claimed?'всё получено':doneCnt+' из 3');

const n=EF.next(S.active);
const plan=[
 {t:n?('Закончить занятие '+n.lesson):'Все занятия пройдены',s:'5 вопросов · около 5 минут',r:Math.min(T.lessons,1)+' из 1',done:T.lessons>=1,href:n?`lesson.html?s=${encodeURIComponent(S.active)}&t=${encodeURIComponent(n.topic.key)}&l=${n.lesson}`:'tasks.html'},
 {t:'Дать 5 верных ответов',s:'Считаются только проверенные ответы',r:Math.min(T.correct,5)+' из 5',done:T.correct>=5,href:'tasks.html'},
 {t:'Забрать награды',s:'Бонус за выполнение целей дня',r:T.claimed?'получено':(doneCnt>=3?'ждёт!':'после 3 целей'),done:!!T.claimed,href:'quests.html'}
];
$('plan').innerHTML=plan.map((p,i)=>`<a class="task" href="${p.href}"><div class="n ${p.done?'done':''}">${p.done?'✓':i+1}</div><div><b>${p.t}</b><p>${p.s}</p></div><em>${p.r}</em></a>`).join('');
$('mist-cnt').textContent=S.mistakes.length?('в копилке: '+S.mistakes.length):'пока пусто';
}
