<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ExamFlow — Профиль</title>
<link rel="icon" type="image/svg+xml" href="brand-avatar.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f3ea;--card:#fffdf7;--line:#e6e1d1;--ink:#12261c;--mute:#6b7a70;--dark:#0f2a1e;--dark2:#173b2a;--lime:#c6f94d;--limed:#9fcf2a;--gold:#e9a13b;--chip:#fbe9c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(#e2dccb 1px,transparent 1.2px) 0 0/16px 16px;color:var(--ink);font:500 15px/1.35 Onest,system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
main{max-width:480px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.top h1{font-size:26px;font-weight:800;margin-right:auto}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-weight:700;font-size:13px}
.pp{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--dark2),var(--dark));color:#fff;border-radius:26px;padding:22px 18px 56px;text-align:center;box-shadow:0 5px 0 #06140d}
.pp:before{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(198,249,77,.22),transparent 70%)}
.edit{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px}
.rgw{position:relative;width:112px;height:112px;margin:0 auto 10px}.rgw svg{position:absolute;inset:0;width:100%;height:100%}#rc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1)}
.av{position:absolute;inset:11px;width:calc(100% - 22px);height:calc(100% - 22px);border-radius:50%;object-fit:cover}
.pp b{display:block;font-size:24px;font-weight:800}.ttl{display:inline-block;margin:6px 0 4px;background:#1f4a35;color:var(--lime);font-weight:800;font-size:12px;padding:5px 12px;border-radius:99px}.nx{font-size:12.5px;color:#b9cfc0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin:-38px 14px 0;position:relative;box-shadow:0 6px 16px rgba(15,42,30,.1)}
.tri div{padding:12px 4px;text-align:center}.tri div+div{border-left:1px solid var(--line)}.tri strong{display:block;font-size:22px;font-weight:800;line-height:1.1}.tri span{font-size:11.5px;color:var(--mute)}
.exl{display:block;width:100%;text-align:left;background:var(--lime);border:2px solid var(--limed);border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 5px 0 var(--limed)}
.exl .r{display:flex;justify-content:space-between;align-items:center}.exl b{font-size:18px;font-weight:800}.exl small{font-size:12.5px;color:#3a5a14;display:block}.exl .n{background:var(--dark);color:var(--lime);border-radius:14px;padding:8px 14px;text-align:center;font-weight:800;font-size:26px;line-height:1}.exl .n span{display:block;font-size:11px;color:#b9cfc0;font-weight:500}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.exl .bar{background:rgba(15,42,30,.16);margin-top:12px}.bar b{display:block;height:100%;background:linear-gradient(90deg,#8ccf2b,var(--lime));border-radius:8px}.exl .bar b{background:var(--dark)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.td{margin-top:12px}.td .r{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}.td small{color:var(--mute);font-weight:500}
h2{font-size:19px;font-weight:800;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}h2 small{font-size:12px;font-weight:500;color:var(--mute)}
.bd{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.bd::-webkit-scrollbar{display:none}
.bg{flex:none;width:88px;text-align:center;background:none;border:0;padding:0}
.bg .ic{width:62px;height:62px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 6px;box-shadow:0 4px 0 var(--limed)}.bg.lk .ic{background:var(--line);box-shadow:0 4px 0 #d3cdbb}.bg.lk svg{opacity:.4}.ic svg{width:28px;height:28px}
.bg small{display:block;font-size:12px;font-weight:700;line-height:1.2}.bg em{font-style:normal;font-size:11px;color:var(--mute)}
details.ac{background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin-bottom:10px;overflow:hidden}
details.ac summary{padding:15px 16px;font-weight:800;list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}details.ac summary::-webkit-details-marker{display:none}
details.ac summary span{flex:1}details.ac summary small{color:var(--mute);font-weight:500;font-size:12.5px}details.ac summary:after{content:"⌄";color:var(--mute);transition:transform .2s}details[open].ac summary:after{transform:rotate(180deg)}
details.ac>div{padding:0 16px 16px}
.sj{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.sj:first-child{border-top:0;padding-top:2px}.sj:last-child{padding-bottom:0}
.sj .g{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--dark)}.sj div{flex:1}.sj b{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.sj b small{color:var(--mute);font-weight:500;font-size:12px}
.wk{display:flex;align-items:flex-end;gap:8px;height:124px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11px;color:var(--mute)}
.wk i{display:block;width:100%;border-radius:8px;background:var(--limed)}.wk i.z{border:1.5px dashed #d3cdbb;background:none}.wk .t i{background:var(--dark)}.wk .t{color:var(--ink);font-weight:800}.wk em{font-style:normal;font-size:11px;font-weight:800;color:var(--ink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.set:first-child{border-top:0;padding-top:2px}.set:last-child{padding-bottom:0}.set b{display:block;font-size:14.5px}.set small{color:var(--mute);font-size:12.5px}
.seg{display:flex;gap:6px}.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}.seg button.on{background:var(--lime);border-color:var(--limed);box-shadow:0 2px 0 var(--limed)}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;border:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}.sw[aria-checked="true"]{background:var(--limed)}.sw[aria-checked="true"]:after{transform:translateX(20px)}
.tm{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 10px;font-weight:700}
.out{display:block;width:100%;margin-top:18px;background:none;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:700;color:var(--mute)}.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--dark);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;border-radius:22px 22px 0 0}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:#a9c0b1;font-size:11.5px;font-weight:700;text-decoration:none}nav a span{font-size:19px;line-height:1}nav a.on{background:var(--lime);color:var(--dark)}
#bk{position:fixed;inset:0;background:rgba(15,42,30,.45);z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}#bk.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;max-height:90%;overflow:auto}#sh.on{transform:none}
#sh h3{font-size:21px;font-weight:800;margin-bottom:12px}#sh label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:12px 0 6px}
#sh input[type=text],#sh input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-weight:700;font-size:16px}
.btn{display:block;width:100%;margin-top:18px;background:var(--lime);color:var(--dark);font-weight:800;font-size:16px;border:0;border-radius:15px;padding:14px;box-shadow:0 4px 0 var(--limed)}
.bi{text-align:center}.bi .ic{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 5px 0 var(--limed)}.bi.lk .ic{background:var(--line);box-shadow:0 5px 0 #d3cdbb}.bi.lk svg{opacity:.4}.bi .ic svg{width:40px;height:40px}.bi p{color:var(--mute);margin:2px 0 12px}
#ts{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-100px);z-index:12;background:var(--lime);color:var(--dark);font-weight:800;border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 var(--limed);transition:transform .3s}#ts.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

<main id="app"></main>
<nav><a href="index.html"><span>⌂</span>Главная</a><a href="tasks.html"><span>✎</span>Задания</a><a href="quests.html"><span>☆</span>Квесты</a><a class="on" href="profile.html"><span>☺</span>Профиль</a></nav>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="school_curriculum.js?v=3"></script>
<script src="state.js?v=5"></script>
<script src="sync.js?v=5"></script>
<script>
EFS.init().then(start).catch(EFS.showBootError);
function start(){
var K='stroke="#12261c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"';
var IC={flame:'<path d="M24 6c2 8 12 12 12 24a12 12 0 0 1-24 0c0-6 4-8 5-14 3 2 4 5 4 8 3-4 4-10 3-18Z"/>',book:'<path d="M24 12C18 8 10 8 4 10v28c6-2 14-2 20 2 6-4 14-4 20-2V10c-6-2-14-2-20 2Zm0 0v28"/>',check:'<circle cx="24" cy="24" r="18"/><path d="M15 25l7 7 12-14"/>',star:'<path d="M24 6l5.5 12L42 19.5l-9 9 2.5 12.5L24 35l-11.5 6L15 28.5l-9-9L18.5 18Z"/>',target:'<circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="10"/><circle cx="24" cy="24" r="2" fill="#12261c"/>',trophy:'<path d="M14 8h20v12a10 10 0 0 1-20 0ZM14 12H6c0 8 4 12 9 12M34 12h8c0 8-4 12-9 12M24 30v8M16 42h16"/>'};
function ic(k){return '<svg viewBox="0 0 48 48" '+K+' aria-hidden="true">'+IC[k]+'</svg>'}
var KEY="examflow_profile_v2";
function readSt(){var x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}return EFS.normalizeSettings(x)}
var st=readSt();
addEventListener('ef:settings-restored',function(){st=readSt()});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}try{window.dispatchEvent(new CustomEvent('ef:profile-saved'))}catch(e){}}
var SUBJC={"Математика":["∑","#c6f94d"],"Базовая математика":["∑","#c6f94d"],"Профильная математика":["∫","#c6f94d"],"Русский язык":["Аа","#ffc29a"],"Информатика":["</>","#c9b8ff"],"Обществознание":["⚖","#9fe0ff"],"Физика":["⚡","#9fe0ff"],"Биология":["🧬","#8ff0b4"],"Химия":["⚗","#ffadca"],"История":["★","#f4d9a6"],"Английский":["Aa","#b8e6ff"],"Литература":["📖","#ffc9a6"],"География":["🌍","#a9e8d8"]};
var $=function(i){return document.getElementById(i)},esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var DEF={oge:"2027-05-22",ege:"2027-05-29"};function cur(){return st.dates[EF.get().exam]}function apx(){return !st.cust[EF.get().exam]}function dtext(){var d=new Date(cur()+"T00:00:00");return isNaN(d)?"дата не задана":d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function days(){var d=new Date(cur()+"T00:00:00");if(isNaN(d))return null;var n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)}
function week(){var log=EF.get().dayLog||{},t=(new Date().getDay()+6)%7,L=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],h="",sum=0,vals=[];
 for(var i=0;i<7;i++){var x=new Date();x.setDate(x.getDate()-t+i);vals.push(log[x.toISOString().slice(0,10)]||0)}
 var mx=Math.max(1,Math.max.apply(null,vals));
 vals.forEach(function(v,i){var f=i>t;if(!f)sum+=v;h+='<div class="'+(i==t?"t":"")+'"><em>'+(f?"":v)+'</em><i class="'+(f?"z":"")+'" style="height:'+(f?16:Math.max(10,v/mx*72))+'px"></i>'+L[i]+'</div>'});return{h:h,sum:sum}}
function toast(t){var e=$("ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2000)}
function lvlName(l){return l<3?"Новичок":l<6?"Знаток":l<10?"Мастер":"Легенда"}
function render(){var S=EF.get(),T=EF.today(),d=days(),w=week();
var topicsDone=EF.subjects().reduce(function(a,n){return a+EF.passedCount(n)},0);
var BD=[["Первый шаг","book",Math.min(EF.totalLessons(),1),1,"Заверши первое занятие"],["Серия 7","flame",Math.min(S.streak,7),7,"Занимайся 7 дней подряд"],["Первая тема","star",Math.min(topicsDone,1),1,"Пройди все 10 занятий темы"],["100 ответов","check",Math.min(S.totalCorrect,100),100,"Дай 100 верных ответов"],["Пять тем","trophy",Math.min(topicsDone,5),5,"Пройди 5 тем"],["Без ошибок ×5","target",Math.min(S.cleanTotal,5),5,"Пройди 5 занятий без ошибок"]];
var done=BD.filter(function(b){return b[2]>=b[3]}).length;
var SUBJ=EF.subjects().map(function(n){var c=SUBJC[n]||["📚","#c6f94d"],tot=EF.topics(n).length*10,les=EF.topics(n).reduce(function(a,x){return a+EF.lessonsDone(n,x.key)},0);return[n,c[0],c[1],les,tot]});
var totalCap=SUBJ.reduce(function(a,x){return a+x[4]},0),pc=Math.round(EF.totalLessons()/totalCap*100)||0;
var mins=T.lessons*5,tg=Math.min(100,mins/st.goal*100);
var lv=EF.level(),need=lv*500-S.xp;
$("app").innerHTML='<div class="top"><h1>Профиль</h1><span class="pill">⚡ '+S.xp+' XP</span><span class="pill">◎ '+S.coins+'</span></div>'+
'<section class="pp"><button class="edit" data-edit="1" aria-label="Редактировать профиль">✎</button><div class="rgw"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#2d5340" stroke-width="6"/><circle id="rc" cx="50" cy="50" r="46" fill="none" stroke="#c6f94d" stroke-width="6" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)"/></svg><img class="av" src="brand-avatar.svg" alt="Аватар ExamFlow"></div><b>'+esc(S.name)+'</b><span class="ttl">Уровень '+lv+' · '+lvlName(lv)+'</span><p class="nx">'+(S.xp%500)+' из 500 XP · до '+(lv+1)+'-го уровня '+need+'</p></section>'+
'<div class="tri"><div><strong>'+S.streak+'</strong><span>дней подряд</span></div><div><strong>'+S.coins+'</strong><span>монет</span></div><div><strong>'+EF.totalLessons()+'</strong><span>занятий</span></div></div>'+
'<button class="exl" data-edit="1"><div class="r"><div><b>До '+(S.exam=="oge"?"ОГЭ":"ЕГЭ")+'</b><small>'+(apx()?"примерно ":"")+dtext()+'</small></div><div class="n">'+(d===null?"—":(apx()?"≈":"")+Math.max(0,d))+'<span>дней</span></div></div><div class="bar"><b style="width:'+pc+'%"></b></div><small style="margin-top:6px">Курс пройден на '+pc+'%</small>'+'</button>'+
'<div class="box td"><div class="r"><span>Цель на сегодня</span><small id="tgt">'+mins+' из '+st.goal+' мин</small></div><div class="bar"><b id="tgb" style="width:'+tg+'%"></b></div></div>'+
'<h2>Достижения <small>'+done+' из '+BD.length+'</small></h2><div class="bd">'+BD.map(function(b,i){var ok=b[2]>=b[3];return '<button class="bg '+(ok?"":"lk")+'" data-b="'+i+'"><div class="ic">'+ic(b[1])+'</div><small>'+b[0]+'</small>'+(ok?"":'<em>'+b[2]+' из '+b[3]+'</em>')+'</button>'}).join("")+'</div>'+
'<h2>Подробнее</h2><details class="ac" open><summary><span>Предметы</span><small>'+SUBJ.length+' предметов</small></summary><div>'+SUBJ.map(function(s){return '<div class="sj"><span class="g" style="background:'+s[2]+'">'+s[1]+'</span><div><b>'+s[0]+'<small>'+s[3]+' из '+s[4]+'</small></b><div class="bar"><b style="width:'+Math.round(s[3]/s[4]*100)+'%"></b></div></div></div>'}).join("")+'</div></details>'+
'<details class="ac"><summary><span>Неделя</span><small>занятий: '+w.sum+'</small></summary><div><div class="wk">'+w.h+'</div></div></details>'+
'<details class="ac"><summary><span>Настройки</span><small>цель, напоминания</small></summary><div><div class="set"><div><b>Цель на день</b><small>Минут занятий</small></div><div class="seg">'+[5,10,15].map(function(g){return '<button data-g="'+g+'" class="'+(st.goal==g?"on":"")+'">'+g+'</button>'}).join("")+'</div></div><div class="set"><div><b>Напоминания</b><small>Ежедневно</small></div><div style="display:flex;gap:8px;align-items:center"><input class="tm" type="time" id="tm" value="'+st.time+'" aria-label="Время напоминания"'+(st.remind?"":" hidden")+'><button class="sw" role="switch" aria-checked="'+st.remind+'" aria-label="Напоминания" data-sw="remind"></button></div></div><div class="set"><div><b>Звуки</b><small>Эффекты при ответах</small></div><button class="sw" role="switch" aria-checked="'+st.sound+'" aria-label="Звуки" data-sw="sound"></button></div></div></details>'+
'<button class="out" data-out="1">Сбросить прогресс</button>'+(EFS.mode==='legacy'&&EFS.user?'<button class="out" data-signout="1" style="margin-top:8px">Выйти из аккаунта</button>':'')+'<p class="foot">ExamFlow — готовься к ОГЭ и ЕГЭ маленькими шагами каждый день.</p>';
requestAnimationFrame(function(){requestAnimationFrame(function(){var r=$("rc");if(r)r.style.strokeDashoffset=289*(1-EF.levelPct()/100)})})}
function openSh(h){$("sh").innerHTML=h;$("sh").classList.add("on");$("bk").classList.add("on")}
function closeSh(){$("sh").classList.remove("on");$("bk").classList.remove("on")}
function edit(){openSh('<h3>Профиль</h3><label for="enm">Имя</label><input type="text" id="enm" maxlength="24" value="'+esc(EF.get().name)+'"><label>Экзамен</label><div class="seg" id="ety"><button data-ty="oge" class="'+(EF.get().exam=="oge"?"on":"")+'">ОГЭ</button><button data-ty="ege" class="'+(EF.get().exam=="ege"?"on":"")+'">ЕГЭ</button></div><label for="eex">Дата экзамена</label><input type="date" id="eex" value="'+cur()+'"><button class="btn" data-save="1">Сохранить</button>')}
document.addEventListener("click",function(e){var t=e.target,b=t.closest("button");if(t.id=="bk"){closeSh();return}if(!b)return;
if(b.dataset.edit)edit();
else if(b.dataset.ty){document.querySelectorAll("#ety button").forEach(function(x){x.classList.toggle("on",x==b)});$("eex").value=st.dates[b.dataset.ty]}
else if(b.dataset.save){EF.get().name=$("enm").value.trim()||"Ученик";EF.save();var ty=document.querySelector("#ety .on").dataset.ty;EF.setExam(ty);EFS.saveProfile();var v=$("eex").value;if(v){st.dates[ty]=v;st.cust[ty]=v!==DEF[ty]}save();closeSh();render();toast("Профиль сохранён")}
else if(b.dataset.b){var x=BD[+b.dataset.b];}
else if(b.dataset.close)closeSh();
else if(b.dataset.g){st.goal=+b.dataset.g;save();b.parentNode.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x==b)});var T2=EF.today();$("tgt").textContent=(T2.lessons*5)+" из "+st.goal+" мин";$("tgb").style.width=Math.min(100,T2.lessons*5/st.goal*100)+"%"}
else if(b.dataset.sw){st[b.dataset.sw]=!st[b.dataset.sw];save();b.setAttribute("aria-checked",st[b.dataset.sw]);if(b.dataset.sw=="remind")$("tm").hidden=!st.remind}
else if(b.dataset.out){if(confirm("Сбросить весь прогресс? Это действие нельзя отменить.")){EF.reset()}}
else if(b.dataset.signout){EFS.signOut().then(function(){var g=null;try{g=localStorage.getItem(KEY+':guest')}catch(e){}
 if(g!==null)localStorage.setItem(KEY,g);else localStorage.removeItem(KEY);
 localStorage.removeItem("ef_guest");location.reload()})}});
document.addEventListener("change",function(e){if(e.target.id=="tm"){st.time=e.target.value;save();toast("Напомним в "+st.time)}});
// badge detail sheet needs BD at click time — rebuild via render
var _render=render;render=function(){_render();window.__BD=[["Первый шаг","book",Math.min(EF.totalLessons(),1),1,"Заверши первое занятие"],["Серия 7","flame",Math.min(EF.get().streak,7),7,"Занимайся 7 дней подряд"],["Первая тема","star",Math.min(EF.subjects().reduce(function(a,n){return a+EF.passedCount(n)},0),1),1,"Пройди все 10 занятий темы"],["100 ответов","check",Math.min(EF.get().totalCorrect,100),100,"Дай 100 верных ответов"],["Пять тем","trophy",Math.min(EF.subjects().reduce(function(a,n){return a+EF.passedCount(n)},0),5),5,"Пройди 5 тем"],["Без ошибок ×5","target",Math.min(EF.get().cleanTotal,5),5,"Пройди 5 занятий без ошибок"]]};
document.addEventListener("click",function(e){var b=e.target.closest("button[data-b]");if(!b)return;var x=window.__BD[+b.dataset.b];if(!x)return;var ok=x[2]>=x[3];openSh('<div class="bi '+(ok?"":"lk")+'"><div class="ic">'+ic(x[1])+'</div><h3>'+x[0]+'</h3><p>'+x[4]+'</p>'+(ok?'<b>Получено ✓</b>':'<div class="bar"><b style="width:'+x[2]/x[3]*100+'%"></b></div><p style="margin-top:8px">'+x[2]+' из '+x[3]+'</p>')+'</div><button class="btn" data-close="1">Понятно</button>')});
render();
}
